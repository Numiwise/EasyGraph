# ============================================================
# 分图 g05·岭南文化与荔湾 — 专属抽取 Profile
# 维度：岭南荔枝文化、荔湾区历史与民俗
# 类型白名单（仅 8 种）：
#   文化符号、地点、历史事件、朝代年号、人物、组织机构、物产作物、作品文献
# ============================================================

entity_types_guidance: |
  本图谱只呈现【岭南荔枝文化与广州荔湾】维度。请只抽取以下 8 种类型，
  严禁抽取荔枝品种、交通线路、制度、产区产业、技术、数据指标等类型
  （它们属于其他维度图谱）。确实无类型匹配时才用 `其他`。

  - 文化符号：荔枝湾传说、荔湾湖八景、泮塘五秀、节庆民俗、工艺、画派、
      粤剧曲艺、名店名吃等文化事象
      属性：类别（传说/景/节庆/民俗/工艺/艺术/名产）, 所在地, 起源, 相传措辞
  - 地点：荔湾区街巷、村镇、河涌、园林（泮塘、荔枝湾、西关、沙面、逢源等）
      属性：类型（街巷/村/河涌/园林）, 古称, 沿革
  - 历史事件：与文化符号相关的地方史事（陆贾开村、南汉御花园设宴等）
      属性：朝代年号, 公元纪年, 关键人物
  - 朝代年号：地方史事时间标尺（南汉、明、清、民国等）
      属性：公元起止年份
  - 人物：岭南文化名人、与荔枝湾相关的地方人物（陆贾、南汉后主、
      粤剧名伶、西关名人）
      属性：朝代/时代, 身份, 与本地的关联
  - 组织机构：文化类机构（八和会馆、粤剧团体、老字号商号）
      属性：类型, 所在地
  - 物产作物：泮塘马蹄、莲藕、菱角等五秀物产及荔枝泛称
      属性：类别, 特产处
  - 作品文献：咏荔枝湾的诗文与地方志（《广东新语》、羊城竹枝词等）
      属性：体裁, 核心名句, 年代

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·实体对齐】
  1. 规范名：泮塘（泮塘村、泮塘五秀中的"五秀"指物产组合，符号类单独命名）；
     西关（西关即荔湾旧称，别名写入描述）。
  2. 作品全称加书名号：《广东新语》《羊城竹枝词》。
  3. 同一景物的不同称呼（荔枝湾/荔湾）不重复建实体，别名入描述。

  【准则二·时间与数据完整】
  - 传说带"相传"（相传陆贾在荔枝湾手植荔枝）；建置年代写朝代+公元
  - 民国、1963年等时间点随事件写明。

  【准则三·不确定性与否定，如实记录】
  - 所有传说、来历故事保留"相传/传说/据说"措辞，不得写成定论。
  - 名物归属有争议时（如荔湾区名是否源于荔枝湾）双方说法并录。

  【准则四·维度聚焦（最高优先，宁缺毋滥）】
  - 只抽岭南荔枝文化、荔湾地方文脉相关实体；全国性制度史、品种农艺、
    现代产业数据不抽（属其他维度）。
  - 每次抽取实体 3–8 个、关系 2–8 条；无关段落可抽取数量为 0。

  【准则五·关系只允许以下标准词】
  - 文化符号—地点：象征、位列、起源于、相传关联、位于
  - 人物—地点：游历至、开基于、定居于、居于；作品—文化符号/地点：记载
  - 人物—作品：创作；事件—时间：发生于；事件—地点：发生地；事件—人物：参与者
  - 组织机构—地点：位于；物产—地点：盛产、出品（泮塘五秀产于泮塘）
  - 文化符号—物产：象征（五秀象征泮塘水乡）
  - 关系描述写具体（含出处、传说措辞），严禁"相关""有关"等模糊词。

