# ============================================================
# 分图 g06·现代产业与科技 — 专属抽取 Profile
# 维度：荔枝现代产区产业、保鲜科技、市场与文旅
# 类型白名单（仅 8 种）：
#   产区产业、技术、数据指标、地点、荔枝品种、组织机构、历史事件、文化符号
# ============================================================

entity_types_guidance: |
  本图谱只呈现【荔枝现代产业与科技】维度。请只抽取以下 8 种类型，
  严禁抽取人物、作品文献、朝代年号、制度、古荔枝树等类型
  （它们属于其他维度图谱）。确实无类型匹配时才用 `其他`。

  - 产区产业：荔枝产区、公用品牌、产业园、批发市场、出口、文旅项目
      属性：所在地, 规模, 年份
  - 技术：冷链、保鲜、育种、数字农业、深加工等技术与设施
      属性：类别, 效果指标（如保鲜率98%）
  - 数据指标：面积（万亩）、产量（万吨）、产值（亿元）、出口量（吨）、
      价格、保鲜期（天）、增长率（%）等产业量化指标
      属性：数值, 单位, 年份, 衡量对象（名称须含数值+单位+年份）
  - 地点：产区所在省市县镇（茂名、高州根子镇、增城仙进奉村等）
      属性：类型, 产业角色
  - 荔枝品种：主栽与新品品种（妃子笑、白糖罂、仙进奉等，仅产业视角）
      属性：主栽区, 商品性状
  - 组织机构：产业主体（产区管理局、龙头企业、科研院所、批发市场运营方）
      属性：类型, 所在地
  - 历史事件：现代产业事件（首次出口北美、电商直播节、文博会参展等）
      属性：年份, 关键主体, 成果
  - 文化符号：产业文旅符号（大唐荔乡、一馆一圃一址、荔枝文化节）
      属性：类别（文旅/节庆/品牌）, 所在地, 年份

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·实体对齐】
  1. 行政地名规范：广州（广州市入描述）、茂名、高州、增城、从化、东莞、
     电白——不带"市/区"后缀建规范名。
  2. 指标实体命名含数值+单位+年份："茂名荔枝产量50万吨（2023）"。
  3. 同一项目不同称呼（大唐荔乡/高州荔枝主题公园）取常用名，别名入描述。

  【准则二·数据必须带单位与年份】
  - 面积（万亩）、产量（万吨）、产值（亿元）、出口（吨）、保鲜率（%）、
    价格（元/万元）必须连同数字、单位、年份写入实体或关系描述。
  - 年份缺失时标注（报道当年）或（原文未标注年份）。

  【准则三·不确定性与否定，如实记录】
  - 计划性、目标性表述（力争、预计）保留原措辞，不写成已实现数据。
  - 报道口径不同（预测值/实际值）分别标注来源年份。

  【准则四·维度聚焦（最高优先，宁缺毋滥）】
  - 只抽荔枝产业直接相关的实体；无关体育活动、城镇化率等宏观数据、
    报社记者、政府官员人物、非荔枝作物不抽。
  - 每次抽取实体 3–8 个、关系 2–8 条；无关段落可抽取数量为 0。

  【准则五·关系只允许以下标准词】
  - 产区产业—地点：位于；产区产业—品种：主栽品种
  - 产区产业—数据指标：面积为、产量为、产值为、出口量为
  - 产区产业—技术：采用；产区产业/物产—地点：出口至、销往
  - 组织机构—地点：位于；组织机构—产区产业：运营、研发
  - 历史事件—时间：发生于；事件—地点：发生地；事件—主体：参与者
  - 文化符号—地点：象征、位于；文化符号—产区产业：依托于
  - 数据指标—任意实体：衡量
  - 关系描述写具体（含数字、年份），严禁"相关""有关"等模糊词。

