# 文本模式样例（ENTITY_EXTRACTION_USE_JSON=false 时使用，契约必需保留）
entity_extraction_examples:
  - |
    输入文本：
    汉和帝永元年间，交州岁贡鲜荔枝，临武县长唐羌上书陈其劳弊，帝乃诏罢之。
    输出：
    entity{tuple_delimiter}永元献荔{tuple_delimiter}历史事件{tuple_delimiter}汉和帝永元年间交州岁贡鲜荔枝，后纳谏罢贡{completion_delimiter}
    entity{tuple_delimiter}唐羌{tuple_delimiter}人物{tuple_delimiter}东汉临武县长，上书请罢荔枝贡{completion_delimiter}
    entity{tuple_delimiter}交州{tuple_delimiter}地点{tuple_delimiter}汉唐岭南行政区，贡荔起运地{completion_delimiter}
    relation{tuple_delimiter}永元献荔{tuple_delimiter}交州{tuple_delimiter}发生地{tuple_delimiter}永元献荔发生于交州{completion_delimiter}
