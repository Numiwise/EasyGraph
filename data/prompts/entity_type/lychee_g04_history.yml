# ============================================================
# 分图 g04·历史与制度 — 专属抽取 Profile
# 维度：荔枝相关的历史事件与典章制度（贡赋、驿传等）
# 类型白名单（仅 8 种）：
#   制度、历史事件、朝代年号、地点、作品文献、物产作物、数据指标、人物
# ============================================================

entity_types_guidance: |
  本图谱只呈现【荔枝历史与典章制度】维度。请只抽取以下 8 种类型，
  严禁抽取荔枝品种、文化符号、产区产业、技术、组织机构等类型
  （它们属于其他维度图谱）。确实无类型匹配时才用 `其他`。

  - 制度：贡赋、驿传、土贡、荔枝市、保鲜方法等典章制度本体
      属性：内容要点, 适用时代, 关键数值（如日行里数、贡额）
  - 历史事件：进贡、罢贡、置贡、设宴、献荔等制度性事件
      属性：朝代年号, 公元纪年, 关键人物, 起因结果
  - 朝代年号：制度与事件的时间标尺（汉、汉和帝永元、唐、南汉、宋、天宝等）
      属性：公元起止年份
  - 地点：制度适用与事件发生地（长安、岭南、交州、涪州、福建等）
      属性：类型, 今属地, 古称
  - 作品文献：记载制度与事件的史籍诗文（《汉书》、苏轼《荔枝叹》、《广东新语》等）
      属性：体裁, 核心记载, 年代
  - 物产作物：荔枝泛称（制度所课之贡品本体）
      属性：特性（三日而味变）, 贡品用途
  - 数据指标：贡额、里程、时限、日行里数等制度量化指标
      属性：数值, 单位, 时代, 衡量对象（名称须含数值+单位）
  - 人物：制度与事件的关键当事人（汉和帝、唐玄宗、杨贵妃、进献者、罢贡建言者）
      属性：朝代, 身份, 在事件中的角色

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·实体对齐】
  1. 规范名：杨贵妃（别名杨玉环写入描述）；长安（今西安）；涪州（今重庆涪陵）；
     交州（汉唐行政区，与具体现代城市区分）。
  2. 作品全称加书名号：《荔枝叹》《汉书》《广东新语》《荔枝谱》。
  3. 古今地名不合并：高州与茂名是两个实体，用"地在今"连接。

  【准则二·制度数值必须完整】
  - 贡额（颗/株）、时限（日）、里程（里）、驿速（里/日）连同单位与年代写入；
    关键数值单独建「数据指标」实体（如"唐代驿传日行约500里"）。
  - 时间公元纪年与年号并写："永元中，约公元85—105年"。

  【准则三·不确定性与否定，如实记录】
  - 考证争议（岭南说/涪州说/福建说）分别如实抽取证据，不下结论。
  - 讹传按否定记录：妃子笑并非杨贵妃命名；"杨贵妃嗜荔枝"个别记载属后人演绎需保留原文措辞。
  - 证据原句必须随事件/制度写入描述："三日而味变""天宝岁贡取之涪"
    "永元荔枝来交州""一骑红尘妃子笑"。

  【准则四·维度聚焦（最高优先，宁缺毋滥）】
  - 只抽与荔枝制度史直接相关的实体；无关朝代八卦、人物轶事、文学赏析不抽。
  - 每次抽取实体 3–8 个、关系 2–8 条；无关段落可抽取数量为 0。

  【准则五·关系只允许以下标准词】
  - 制度—事件/线路：适用于；制度—数据指标：规定
  - 事件—时间：发生于；事件—地点：发生地；事件—人物：参与者
  - 事件—人物/地点：进献（含进献物与对象）
  - 作品—制度/事件：记载；人物—作品：创作
  - 事件/朝代：早于、晚于；今产区—古制度/事件：延续传承
  - 数据指标—任意实体：衡量
  - 关系描述写具体（含制度名、数值、原文依据），严禁"相关""有关"等模糊词。

