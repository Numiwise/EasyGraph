# ============================================================
# 《图谱探案：妃子笑的身世之谜》— 荔枝文化知识图谱定制 Prompt Profile
# 领域：荔枝文化 / 历史人物与文献 / 地理交通 / 品种 / 典章制度 /
#       岭南文化与荔湾 / 现代产业与科技（六大维度统一 Schema）
# 用途：让 LightRAG 按本课 Schema 抽取【实体（含属性）+ 关系】
#
# 设计要点（服务于课程 P12–P16）：
#   1. 六个分图谱 + 一个总图谱共用同一套类型/关系词表 →
#      实体命名一致，P15「合」时共同节点才能自动对齐合并。
#   2. 突出多跳桥接关系（人物—作品—地点—品种—事件—制度—产业）。
#   3. 实体对齐规则内置（杨贵妃=杨玉环、长安=京师、涪州=涪陵）。
#   4. 数值必带单位年份；传说/争议保留不确定措辞；讹传按否定记录。
#
# 使用方法：
#   1. 本文件放在 PROMPT_DIR/entity_type/ 下（已放置）
#   2. .env 中设置：
#        ENTITY_EXTRACTION_USE_JSON=true
#        ENTITY_TYPE_PROMPT_FILE=lychee_culture.yml
#        MAX_EXTRACTION_RECORDS=60
#        MAX_EXTRACTION_ENTITIES=30
#   3. 重启 LightRAG 容器生效；所有工作区（workspace）共用本 Profile
# ============================================================

entity_types_guidance: |
  请使用以下 15 种中文类型对每个实体分类。若确实没有类型匹配，才使用 `其他`。

  - 人物：真实历史人物或现代人物（帝王、后妃、诗人、宦官、使节、学者、农艺师等）
      属性：朝代/时代, 身份职务, 籍贯（古今地名）, 别名/封号
  - 作品文献：诗、文、古籍、谱录、笔记、史书、学术文章、权威报道
      属性：体裁（诗/文/谱/笔记/史书/报道）, 作者, 朝代或年份, 核心名句/关键记载
  - 荔枝品种：有专名的荔枝栽培品种
      属性：别名, 原产地, 成熟期, 单果重, 风味特征, 命名由来
  - 物产作物：荔枝（泛称）、荔枝干等物产，不特指某品种
      属性：科属, 特性（如易变质、保鲜期）, 用途
  - 地点：都城、州府、区县、镇村、产区、河涌、园林等地理实体
      属性：类型（都城/州/区/镇/园/河涌）, 今属地, 古称/别名
  - 交通线路：驿道、贡路、水路等交通线路本体
      属性：起点, 终点, 里程（里/km）, 通行时间, 驿递制度
  - 历史事件：进贡、罢贡、移植、设宴、拍卖、开凿驿道等有时间地点的事件
      属性：朝代年号, 公元纪年, 关键人物, 起因结果
  - 朝代年号：朝代、年号等时间标尺（如汉、唐、宋、南汉、天宝、永元）
      属性：公元起止年份
  - 制度：驿传、贡赋、保鲜方法等典章制度与方法
      属性：内容要点, 适用时代, 关键数值（如日行里数）
  - 文化符号：传说、景点、八景、节庆、民俗、工艺、画派、名句等文化事象
      属性：类别（传说/景/节庆/民俗/工艺/艺术/名句）, 所在地, 起源
  - 古荔枝树：有名姓、有树龄记载的母树或古树群
      属性：树龄, 位置, 株数, 所属品种
  - 产区产业：荔枝产区、公用品牌、产业园、文旅项目、市场等产业实体
      属性：所在地, 规模, 年份
  - 技术：冷链、保鲜、育种、数字农业、深加工等技术与设施
      属性：类别, 效果指标
  - 组织机构：政府部门、科研院所、企业等机构
      属性：层级/类型
      （⚠️ 仅当该机构是荔枝产区管理/科研/产业主体且必须与探案链相连时才抽，其余一律不抽）
  - 数据指标：可量化的产量、面积、产值、距离、速度、价格、比例、树龄等指标
      属性：数值, 单位, 年份, 衡量对象（实体名称须含数值+单位+年份）
      （⚠️ 仅抽取与荔枝产地/产量/价格/树龄/保鲜直接相关的指标，一次最多 2 个；无关统计数字不抽）

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·实体对齐：一个事物只用一个规范名】
  1. 同一事物的不同称呼不得另建实体，一律使用规范名，别名写入 description：
     - 杨贵妃（规范名）；杨玉环、玉环、贵妃 → 写入描述，不另建节点。
     - 长安（规范名，括注"今西安"）；京师、京城 → 写入描述。
     - 涪州（规范名，括注"今重庆市涪陵区"）；涪陵 → 写入描述。
     - 作品一律用全称并加书名号：《过华清宫》《荔枝图序》《荔枝叹》
       《食荔枝》《西京杂记》《荔枝谱》《广东新语》。
  2. 古今地名不可盲目合并：高州（唐代州名）与茂名（今广东省茂名市）是两个实体，
     用"地在今"关系连接；交州（汉唐行政区）与具体现代城市同理。
  3. 同名异物必须拆分为两个实体并加"同名异物"关系：
     如四川合江"妃子笑"（红妃，全红成熟）≠ 广东妃子笑（青妃，转红1/3成熟）。
  4. 品种标准名：妃子笑、桂味、糯米糍、挂绿、白糖罂、三月红、黑叶、尚书怀；
     玉荷包、落塘蒲、蜂糖荔、乌叶等别名写入对应品种描述。

  【准则二·数值属性必须带单位与年份】
  - 距离/里程：保留原文单位（唐"里"或"km/公里"），如"2240里""约1100公里"；
    文本若给出"唐一里约530米"等换算，一并写入描述。
  - 时间：公元纪年与年号都要写（如"天宝年间，约公元750年""汉高祖时期，约公元前200年"）。
  - 产业数据：面积（万亩）、产量（万吨）、产值（亿元）、占比（%）、价格（万元/元）、
    树龄（年/世纪）、保鲜期（天/日）等必须连同数字、单位、年份写入实体或关系描述。
  - 关键量化指标单独建成「数据指标」实体，实体名称包含"指标+数值+单位+年份"，
    例如"茂名荔枝种植面积141万亩（2023）"。

  【准则三·不确定性与否定，如实记录】
  - 凡原文带"相传、传说、一说、有争议、可能、或云"的说法，描述中必须保留这些措辞，
    不得改写成确定事实（如"相传陆贾在荔枝湾手植荔枝""相传高力士举荐家乡荔枝"）。
  - 原文明确否定或证伪的说法，必须以否定句记录，严禁把讹传抽成事实：
    例："妃子笑"并非杨贵妃亲自命名；杜牧诗中"妃子笑"并非现今的妃子笑品种；
    宋明《荔枝谱》无妃子笑记载，直到清陈鼎《荔枝谱》才出现。
  - 对立观点要保留：如荔枝产地"岭南说"与"涪州说"，分别如实抽取各自证据，不替原文下结论。

  【准则四·主题聚焦（最高优先，宁缺毋滥）】
  - 本课主题：考证"妃子笑"荔枝的身世与产地之争（岭南说 vs 涪州说），
    核心探案链 = 人物（杨贵妃/高力士/杜牧/苏轼/张九龄/赵佗等）—作品文献（诗词/谱录/笔记）
    —地点（长安/岭南/高州/茂名/涪州/增城等）—品种（妃子笑/挂绿/糯米糍等）
    —事件（天宝贡荔/永元献荔）—制度（驿传/贡赋）—文化（传说/符号/名句）—现代产业（产区/保鲜/出口）。
  - 每个抽取的实体/关系必须能沿关系链连回上述核心探案链；与荔枝无关、或仅作为
    背景一笔带过、无法连回探案链的人物（如无关历史人物、影星、现代官员）、
    泛化机构（如某报社、某省厅，除非直接是产区管理部门）、无关技术名词、无关
    数据（如城镇化率、人口普查数）一律不抽。
  - 宁可少抽几个，不可滥抽散点：若一段文本只出现无关信息，该段可抽取数量为 0。
  - 每次抽取实体总数控制在 3–8 个，关系总数控制在 2–8 条；杜绝一次抽取几十个实体。

  【准则五·描述与关系质量】
  1. 实体描述 15–60 字，包含关键属性（身份/朝代/地点/数值）和原文关键信息；
     支撑多跳推理的"证据原句"（如"三日而味变""天宝岁贡取之涪""永元荔枝来交州"）
     要随相关作品/事件写入描述。
  2. 关系关键词必须使用下列标准词（不得自造近义词）：
     - 人物—作品：创作
     - 作品—他物：记载（作品记载人物/事件/地点/制度/品种/物产）
     - 人物—人物：举荐、进献、朝见、近侍、师从
     - 人物—地点：籍贯、任职于、被贬于、游历至
     - 人物—物产/品种：喜爱、种植培育
     - 机构/人物—品种：选育改良
     - 品种—地点：原产于、主栽于
     - 地点—物产/品种：盛产、出品
     - 品种—古树：母树为
     - 品种/地点/符号—作品或事物：得名于
     - 品种—品种：同名异物、嫁接改种
     - 地点—地点：位于、地在今（古今对应）、相距
     - 线路—地点：起于、止于、途经
     - 事件—时间：发生于；事件—地点：发生地；事件—人物：参与者
     - 事件—人物/地点：进献（含进献物与对象）
     - 事件/朝代：早于、晚于
     - 制度—事件/线路：适用于；制度—数据指标：规定
     - 文化符号—地点：象征、位列、起源于、相传关联
     - 产区产业—地点：位于；—品种：主栽品种；—数据指标：面积为、产量为、产值为
     - 产区产业—技术：采用；产区产业/物产—地点：出口至、销往
     - 今产区—古制度/事件：延续传承
     - 数据指标—任意实体：衡量
  3. 关系描述要具体，写出关系内容与依据，严禁使用"相关""有关""有联系"等模糊词。
     好："苏轼《荔枝叹》'天宝岁贡取之涪'，记载天宝贡荔取自涪州"；
     坏："苏轼和涪州有关"。
  4. 优先保留能把不同维度连起来的"桥接关系"（如人物↔地点↔品种↔作品↔事件），
     它们是多跳推理的路径，不要遗漏。

