# ============================================================
# 分图 g01·人物与文献 — 专属抽取 Profile
# 维度：与荔枝相关的历史/文学人物及其诗文文献
# 类型白名单（仅 7 种，超出范围的一律不抽）：
#   人物、作品文献、历史事件、朝代年号、文化符号、荔枝品种、地点
# ============================================================

entity_types_guidance: |
  本图谱只呈现【荔枝文化与历史人物、文献】维度。请只抽取以下 7 种类型，
  严禁抽取交通线路、制度、产区产业、技术、组织机构、数据指标等类型
  （它们属于其他维度图谱）。确实无类型匹配时才用 `其他`。

  - 人物：与荔枝典故/诗文/进贡史直接相关的历史人物与文学作者
      属性：朝代/时代, 身份职务, 籍贯（古今地名）, 别名/封号
  - 作品文献：荔枝题材的诗、文、谱录、笔记、史书（一律全称加书名号）
      属性：体裁, 作者, 朝代或年份, 核心名句/关键记载
  - 历史事件：与人物/文献直接相关的进贡、罢贡、设宴、手植等事件
      属性：朝代年号, 公元纪年, 关键人物, 起因结果
  - 朝代年号：人物活动与作品创作的时间标尺（汉、唐、宋、南汉、天宝等）
      属性：公元起止年份
  - 文化符号：诗文名句、典故、传说（如"一骑红尘妃子笑"）
      属性：类别（名句/典故/传说）, 出处, 相传措辞
  - 荔枝品种：诗文中得名或被记载的品种（妃子笑、挂绿等）
      属性：别名, 得名由来, 被记载的作品
  - 地点：人物籍贯、任职地、作品描写地、贡送目的地（长安、岭南、高州、涪州、增城等）
      属性：类型（都城/州/区/园）, 今属地, 古称

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·实体对齐：一个事物只用一个规范名】
  1. 同一事物不同称呼不得另建实体，别名写入 description：
     杨贵妃（规范名；杨玉环、玉环、贵妃 → 写入描述）；长安（规范名，括注今西安；
     京师、京城 → 写入描述）；涪州（规范名，括注今重庆涪陵；涪陵 → 写入描述）。
  2. 作品一律用全称并加书名号：《过华清宫》《荔枝图序》《荔枝叹》《食荔枝》
     《西京杂记》《荔枝谱》《广东新语》。
  3. 古今地名不合并：高州（唐州名）与茂名（今市）是两个实体，用"地在今"连接。
  4. 同名异物拆分：四川合江"妃子笑"（红妃）≠ 广东妃子笑（青妃），加"同名异物"关系。

  【准则二·数值与时间必须完整】
  - 公元年份与年号都要写（"天宝年间，约公元750年"）；保留原文计量（"2240里"）。

  【准则三·不确定性与否定，如实记录】
  - "相传、一说、有争议"等措辞必须保留，不得改写成确定事实
    （如"相传高力士举荐家乡荔枝"）。
  - 讹传按否定记录：妃子笑并非杨贵妃亲自命名；杜牧诗中妃子笑非今妃子笑品种。
  - 产地之争双方观点（岭南说/涪州说）分别如实抽取，不下结论。
  - 证据原句随作品/事件写入描述："三日而味变""天宝岁贡取之涪""永元荔枝来交州"。

  【准则四·维度聚焦（最高优先，宁缺毋滥）】
  - 只抽与荔枝典故直接相关的人物/文献/事件；与荔枝无关的历史人物、
    官职名、泛机构、现代新闻人物一律不抽。
  - 每次抽取实体 3–8 个、关系 2–8 条；无关段落可抽取数量为 0。

  【准则五·关系只允许以下标准词】
  - 人物—作品：创作；作品—他物：记载；人物—人物：举荐、进献、朝见、近侍、师从
  - 人物—地点：籍贯、任职于、被贬于、游历至；人物—品种/物产：喜爱
  - 品种—作品：得名于；地点—地点：位于、地在今
  - 事件—时间：发生于；事件—地点：发生地；事件—人物：参与者
  - 事件/朝代：早于、晚于；文化符号—地点/人物：象征、相传关联
  - 关系描述写具体依据（作品+诗句），严禁"相关""有关"等模糊词。

entity_extraction_json_examples:
  - |
    {
      "entities": [
        {
          "name": "杜牧",
          "type": "人物",
          "description": "唐代诗人，《过华清宫》作者，诗句一骑红尘妃子笑为妃子笑品种得名之源"
        },
        {
          "name": "《过华清宫》",
          "type": "作品文献",
          "description": "唐代杜牧七言绝句，名句一骑红尘妃子笑，无人知是荔枝来，描写驿送鲜荔枝"
        },
        {
          "name": "杨贵妃",
          "type": "人物",
          "description": "即杨玉环，唐玄宗贵妃，嗜食鲜荔枝，天宝岁贡享用对象"
        },
        {
          "name": "天宝",
          "type": "朝代年号",
          "description": "唐玄宗年号，公元742—756年，贡荔事件发生时期"
        }
      ],
      "relationships": [
        {
          "source": "杜牧",
          "target": "《过华清宫》",
          "keywords": "创作",
          "description": "杜牧创作《过华清宫》，诗中描写驿马千里运送鲜荔枝"
        },
        {
          "source": "《过华清宫》",
          "target": "杨贵妃",
          "keywords": "记载",
          "description": "诗句记述为杨贵妃驿送鲜荔枝的史事"
        },
        {
          "source": "杨贵妃",
          "target": "天宝",
          "keywords": "生活于",
          "description": "杨贵妃生活在唐玄宗天宝年间"
        }
      ]
    }

# 文本模式样例（ENTITY_EXTRACTION_USE_JSON=false 时使用，契约必需保留）
entity_extraction_examples:
  - |
    输入文本：
    唐代诗人杜牧路过华清宫，写下《过华清宫》：“一骑红尘妃子笑，无人知是荔枝来。”
    输出：
    entity{tuple_delimiter}杜牧{tuple_delimiter}人物{tuple_delimiter}唐代诗人，《过华清宫》的作者{completion_delimiter}
    entity{tuple_delimiter}《过华清宫》{tuple_delimiter}作品文献{tuple_delimiter}唐代杜牧所作七言绝句，载有名句“一骑红尘妃子笑，无人知是荔枝来”{completion_delimiter}
    relation{tuple_delimiter}杜牧{tuple_delimiter}《过华清宫》{tuple_delimiter}创作{tuple_delimiter}杜牧创作了《过华清宫》{completion_delimiter}
    {completion_delimiter}
