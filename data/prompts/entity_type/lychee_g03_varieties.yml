# ============================================================
# 分图 g03·荔枝品种 — 专属抽取 Profile
# 维度：荔枝栽培品种、母树、特性与得名
# 类型白名单（仅 8 种）：
#   荔枝品种、古荔枝树、物产作物、地点、数据指标、文化符号、作品文献、技术
# ============================================================

entity_types_guidance: |
  本图谱只呈现【荔枝品种】维度。请只抽取以下 8 种类型，
  严禁抽取人物、朝代年号、历史事件、制度、产区产业、组织机构等类型
  （它们属于其他维度图谱）。确实无类型匹配时才用 `其他`。

  - 荔枝品种：有专名的荔枝栽培品种（妃子笑、桂味、糯米糍、挂绿、白糖罂、
      三月红、黑叶、尚书怀等）
      属性：别名, 原产地, 成熟期, 单果重, 风味特征, 命名由来
  - 古荔枝树：有名姓、有树龄记载的母树或古树群（挂绿母树、千年贡园古荔）
      属性：树龄, 位置, 株数, 所属品种
  - 物产作物：荔枝泛称、荔枝干等物产本体
      属性：科属, 特性（易变质、保鲜期）, 用途
  - 地点：品种原产地与主栽区（增城、东莞、高州根子镇等）
      属性：类型, 今属地, 古称
  - 数据指标：单果重、糖度、成熟期天数、树龄、拍卖价等品种量化指标
      属性：数值, 单位, 年份, 衡量对象（名称须含数值+单位）
  - 文化符号：品种得名典故、传说（如挂绿传奇、妃子笑典故）
      属性：类别（典故/传说）, 出处, 相传措辞
  - 作品文献：品种得名的诗文与记载品种的谱录（《过华清宫》、蔡襄《荔枝谱》、
      陈鼎《荔枝谱》等）
      属性：体裁, 核心名句, 记载要点
  - 技术：品种选育、嫁接、圈枝等繁殖技术（仅与品种直接相关时抽取）
      属性：类别, 应用品种

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·品种标准名与对齐】
  1. 品种用标准名：妃子笑、桂味、糯米糍、挂绿（规范名"增城挂绿"）、白糖罂、
     三月红、黑叶、尚书怀；玉荷包、落塘蒲、蜂糖荔、乌叶等别名写入对应品种描述。
  2. 同名异物必须拆分为两个实体并加"同名异物"关系：
     四川合江"妃子笑"（红妃，全红成熟）≠ 广东妃子笑（青妃，转红1/3成熟）。
  3. 古今地名不合并：高州（唐州名）与茂名（今市）用"地在今"连接。

  【准则二·量化属性必须带单位与年份】
  - 单果重（g/克）、糖度、成熟期（月/旬）、树龄（年）、价格（万元，含年份）：
    数字+单位+年份一并写入描述；关键指标单独建「数据指标」实体
    （如"增城挂绿拍卖价55.5万元/颗（2002）"）。

  【准则三·不确定性与否定，如实记录】
  - 得名传说必须带"相传"（如相传挂绿为八仙遗绿绶带）。
  - 讹传按否定记录：杜牧诗中"妃子笑"并非今妃子笑品种；宋明《荔枝谱》无妃子笑
    记载，直到清陈鼎《荔枝谱》才出现。
  - 品种归属之争（如妃子笑与糯米糍关系）保留双方说法。

  【准则四·维度聚焦（最高优先，宁缺毋滥）】
  - 只抽品种本体及其直接相关实体（原产地、母树、得名文献、量化指标）；
    现代产业数据、冷链出口、人物生平、机构新闻不抽（属其他维度）。
  - 每次抽取实体 3–8 个、关系 2–8 条；无关段落可抽取数量为 0。

  【准则五·关系只允许以下标准词】
  - 品种—地点：原产于、主栽于；地点—品种：盛产、出品
  - 品种—古树：母树为；品种—品种：同名异物、嫁接改种
  - 品种—作品：得名于、记载；品种—文化符号：得名于
  - 技术—品种：适用于；数据指标—任意实体：衡量
  - 古树—地点：位于
  - 关系描述写具体（含数字、别名、诗句依据），严禁"相关""有关"等模糊词。

