# ============================================================
# 分图 g02·地点与交通 — 专属抽取 Profile
# 维度：荔枝相关的地理产地与古代交通/驿路
# 类型白名单（仅 8 种）：
#   地点、交通线路、数据指标、制度、历史事件、朝代年号、物产作物、荔枝品种
# ============================================================

entity_types_guidance: |
  本图谱只呈现【荔枝产地地理与交通驿路】维度。请只抽取以下 8 种类型，
  严禁抽取人物、作品文献、文化符号、产区产业、技术、组织机构等类型
  （它们属于其他维度图谱）。确实无类型匹配时才用 `其他`。

  - 地点：荔枝产地与运输途经的都城、州府、区县、镇村、河涌、园林
      属性：类型（都城/州/区/镇/园/河涌）, 今属地, 古称/别名
  - 交通线路：荔枝北运的驿道、贡路、水路（荔枝道、子午道、梅关道等）
      属性：起点, 终点, 里程（里/km）, 通行时间, 所涉驿传制度
  - 数据指标：里程、运距、运时等量化指标（名称须含数值+单位）
      属性：数值, 单位, 年代依据, 衡量对象
  - 制度：驿传、贡赋、保鲜运送方法等制度本体
      属性：内容要点, 适用时代, 关键数值（如日行里数）
  - 历史事件：开凿驿道、置驿、贡路启用等事件
      属性：朝代年号, 公元纪年, 起因结果
  - 朝代年号：线路与贡运的时间标尺（汉、唐、天宝、永元等）
      属性：公元起止年份
  - 物产作物：荔枝（泛称）及沿路相关物产
      属性：特性（易变质、保鲜期）, 用途
  - 荔枝品种：沿线产地所产品种（仅与产地/线路直接相关时抽取）
      属性：原产地, 被贡送情况

  ========================= 抽取准则（必须严格遵守） =========================

  【准则一·实体对齐与地名规范】
  1. 古今地名不可盲目合并：高州（唐州名）与茂名（今市）是两个实体，
     用"地在今"连接；交州与具体现代城市同理。
  2. 同一地不同称呼不得另建实体：长安（规范名，括注今西安；京师、京城写入描述）；
     涪州（规范名，括注今重庆涪陵；涪陵写入描述）。
  3. 线路用规范名（荔枝道、子午道、梅关道），别称写入描述。

  【准则二·里程与时间必须带单位/年份】
  - 保留原文单位："2240里""约1100公里"；若有换算（唐一里约530米）一并写入描述。
  - 运送时间写清楚（"三日而味变"指保鲜时限，驿传"日行五百里"等）。

  【准则三·不确定性与否定，如实记录】
  - "相传、一说、考证认为"等措辞保留；产地之争双方证据（岭南说/涪州说）
    分别抽取，不下结论。
  - 讹传按否定记录：如"妃子笑并非杨贵妃命名"不在此图抽为事实。

  【准则四·维度聚焦（最高优先，宁缺毋滥）】
  - 只抽与荔枝产地/运输直接相关的地理与线路实体；
    与荔枝无关的地名（仅作背景提及的城市）、现代交通、无关机构、无关人物不抽。
  - 每次抽取实体 3–8 个、关系 2–8 条；无关段落可抽取数量为 0。

  【准则五·关系只允许以下标准词】
  - 线路—地点：起于、止于、途经；地点—地点：位于、地在今、相距
  - 制度—线路/事件：适用于；制度—数据指标：规定
  - 地点—物产/品种：盛产、出品；品种—地点：原产于、主栽于
  - 事件—时间：发生于；事件—地点：发生地
  - 事件/朝代：早于、晚于；今产地—古制度/事件：延续传承
  - 数据指标—任意实体：衡量
  - 关系描述写具体（含里程数字、线路名、地名依据），严禁"相关""有关"等模糊词。

