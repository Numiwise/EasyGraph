# 文本模式样例（ENTITY_EXTRACTION_USE_JSON=false 时使用，契约必需保留）
entity_extraction_examples:
  - |
    输入文本：
    相传唐天宝年间，涪州岁贡鲜荔枝，经荔枝道驿传北运长安，全程约两千余里。
    输出：
    entity{tuple_delimiter}荔枝道{tuple_delimiter}交通线路{tuple_delimiter}涪州贡荔北运长安的驿道，相传全程约两千余里{completion_delimiter}
    entity{tuple_delimiter}涪州{tuple_delimiter}地点{tuple_delimiter}唐代州名，今重庆涪陵，贡荔起运地{completion_delimiter}
    entity{tuple_delimiter}长安{tuple_delimiter}地点{tuple_delimiter}唐代都城，今西安，贡荔目的地{completion_delimiter}
    relation{tuple_delimiter}荔枝道{tuple_delimiter}涪州{tuple_delimiter}起于{tuple_delimiter}荔枝道起于涪州{completion_delimiter}
    relation{tuple_delimiter}荔枝道{tuple_delimiter}长安{tuple_delimiter}止于{tuple_delimiter}荔枝道止于长安{completion_delimiter}
    {completion_delimiter}
