# ============================================================
# 免 build 部署：LightRAG（官方镜像） + Neo4j + Qdrant + PostgreSQL
# ------------------------------------------------------------
# 镜像策略：
#   - LightRAG 使用 ghcr.1ms.run 国内 ghcr 加速域名（免本地 build）
#   - Neo4j / Qdrant / PostgreSQL / pgAdmin 使用 Docker Hub 官方镜像
# 存储策略：
#   - 图存储 → Neo4j（替换默认 NetworkXStorage）
#   - 向量存储 → Qdrant（替换默认 NanoVectorDBStorage）
#   - KV / DocStatus → PostgreSQL（替换默认 JSON 文件存储）
# 可视化：
#   - 前端可视化大屏 : http://localhost:5006
#   - Neo4j Browser  : http://localhost:7474
#   - Qdrant Dashboard: http://localhost:6333/dashboard
#   - pgAdmin (PG)   : http://localhost:5050
# ============================================================
services:
  # ========== Neo4j 图数据库（完整版，LightRAG 写入） ==========
  neo4j:
    image: neo4j:5.26
    container_name: lightrag-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser Web UI（仅本地，外部不可达）
      - "127.0.0.1:7687:7687"   # Bolt 协议（LightRAG 抽取写入此实例，仅本地）
    environment:
      # NEO4J_PASSWORD 由 .env 提供；缺失时 compose 拒绝启动（fail-fast）。
      # 写死默认密码会变成"全网通用口令"，违背用户安装后自由替换的初衷。
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
      NEO4J_server_bolt_listen__address: ":7687"
      NEO4J_server_http_listen__address: ":7474"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ========== Neo4j 图数据库（展示版，清理后的精简图供前端使用） ==========
  # 设计：
  #   - 数据卷 neo4j_display_data 从 neo4j_data 全量复制（保留完整版可恢复）
  #   - 启动后在此实例上跑 scripts/graph/clean+prune+kcore+merge 持久化清理
  #   - 前端 webviz 仅连此实例（bolt://localhost:7688），不读完整版
  #   - LightRAG 继续写完整版（lightrag-neo4j:7687），不影响展示版
  neo4j-display:
    image: neo4j:5.26
    container_name: lightrag-neo4j-display
    restart: unless-stopped
    ports:
      - "127.0.0.1:7475:7474"   # Neo4j Browser Web UI（展示版，仅本地）
      - "127.0.0.1:7688:7687"   # Bolt 协议（api-bridge 通过 compose 内部网络访问）
    environment:
      # NEO4J_PASSWORD 由 .env 提供；缺失时 compose 拒绝启动（fail-fast）。
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
      NEO4J_server_bolt_listen__address: ":7687"
      NEO4J_server_http_listen__address: ":7474"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_display_data:/data
      - neo4j_display_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ========== Qdrant 向量数据库 ==========
  # 轻量级向量数据库，内置 Dashboard 可视化界面
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lightrag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # HTTP API + Dashboard（仅本地）
      - "127.0.0.1:6334:6334"   # gRPC 端口（仅本地）
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

# ========== PostgreSQL（KV / DocStatus 存储） ==========
  # 提供 pgvector 扩展，未来如需向量存储也可切换到 PGVectorStorage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightrag-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # PostgreSQL 协议（仅本地）
    environment:
      # 全部从 .env 注入；缺失时 compose 拒绝启动（fail-fast），避免默认口令泄露。
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:?请在 .env 中设置 POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DATABASE:?}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

# ========== pgAdmin（PostgreSQL Web UI） ==========
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lightrag-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"     # pgAdmin Web UI（仅本地）
    environment:
      # pgAdmin 凭证全部从 .env 注入；缺失时 compose 拒绝启动（fail-fast）。
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?请在 .env 中设置 PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?请在 .env 中设置 PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ========== 后端 API 网关（FastAPI，轻量化，隔离前端与数据库直连） ==========
  # 职责：
  #   - 前端浏览器不再直连 Neo4j bolt:// 和 Qdrant http://（避免 JS 暴露数据库地址/密码）
  #   - 前端只访问 /api/*，nginx 反代到本服务（同一容器网络，无 CORS）
  #   - 本服务持有 Neo4j/Qdrant 凭证（通过环境变量注入，不在前端代码里）
  #   - 仅暴露端口 9630 绑定 127.0.0.1（不暴露到宿主机网络，对外不可访问）
  api-bridge:
    image: python:3.11-slim
    container_name: lightrag-api-bridge
    restart: unless-stopped
    working_dir: /app
    # 单行 command：pip 安装依赖后启动 uvicorn（bash -c 避免 PowerShell ; 注入问题）
    command: ["bash", "-c", "pip install --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt && exec uvicorn backend.main:app --host 0.0.0.0 --port 9630 --proxy-headers"]
    volumes:
      # .env 包含 NEO4J_PASSWORD 等敏感信息，只读挂载
      - ./.env:/app/.env:ro
      # backend/ 目录包含后端网关代码（config.py, db.py, queries.py 等）
      - ./backend:/app/backend:ro
      # requirements.txt 包含 api-bridge 的 Python 依赖
      - ./requirements.txt:/app/requirements.txt:ro
    environment:
      # Neo4j 连接（展示版数据库，bolt://neo4j-display:7687，密码从 .env 注入；缺失则启动失败）
      NEO4J_URI: "bolt://neo4j-display:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}"
      # 后端到前端共享的 bridge token（用于 nginx -> api-bridge 的请求认证）
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:?请在 .env 中设置 BRIDGE_TOKEN}"
      # Qdrant 连接（compose 内部网络，服务名=qdrant）
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_CHUNK_COLLECTION: "lightrag_vdb_chunks_baai_bge_m3_1024d"
    ports:
      - "127.0.0.1:9630:9630"   # 仅绑定本地环回，外网无法直接访问
    depends_on:
      neo4j-display:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ========== 图谱可视化大屏（Vue3 + Vite，通过 nginx 反代访问后端 api-bridge） ==========
  # 安全架构：
  #   浏览器 → nginx:80 → api-bridge:9630 → neo4j-display:7687 / qdrant:6333
  #   浏览器不再直连数据库（Neo4j bolt / Qdrant HTTP），凭证只存在于 api-bridge 容器内。
  #   部署方式一（推荐，秒启动）：bind 挂载本地已构建的 ./dist 到 nginx 静态目录
  #     前置：先 npm install && npm run build 生成 ./dist
  #     启动：docker compose up -d webviz
  #   部署方式二（可选，打包镜像）：webviz.Dockerfile 多阶段构建
  #     启动：docker compose --profile build build webviz
  #   七个工作区路由切换 / 按实体类型着色筛选 / 搜索 / 点击查看实体与关系描述
  webviz:
    image: nginx:alpine
    container_name: lightrag-webviz
    restart: unless-stopped
    depends_on:
      neo4j-display:
        condition: service_started
    ports:
      - "5006:80"   # 图谱可视化大屏（http://localhost:5006）
    # 把 LLM key 从 .env 注入容器，供 nginx 模板 envsubst（见下）使用。
    # 安全：key 走 .env（不入 git），不在代码里写死。
    environment:
      LLM_BINDING_API_KEY: "${LLM_BINDING_API_KEY:-}"
      # Bridge token：nginx 在 /api/ 反代时把它写到 X-Bridge-Token 头，
      # api-bridge 校验通过才返回数据。这样 nginx 同源 /api/ 调用安全，
      # 任何绕过 nginx 的直接请求（curl 9630 等）会被 401。
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:?请在 .env 中设置 BRIDGE_TOKEN}"
    volumes:
      # 前端 SPA 静态产物（Vue3 + Vite 构建后 = dist）
      - ./dist:/usr/share/nginx/html:ro
      # 原文资料（已解析的 markdown）挂载到容器内独立路径 /kb，供前端「查看完整原文」使用
      # 注意：不能挂到 /usr/share/nginx/html 之下（该目录为只读挂载，无法创建子挂载点）
      # 访问路径：http://localhost:5006/kb/<workspace>/__parsed__/<文件名>
      - ./data/inputs:/kb:ro
      # 自定义 nginx 配置：
      #   nginx-main.conf  → 主配置（user root，规避挂载文件 0600 权限问题）
      #   nginx-webviz.conf → 站点配置（暴露 /kb/ 纯文本目录 + SPA 回落）
      #     * 以 .template 挂在 /etc/nginx/templates/ 下，nginx 官方 entrypoint 会在
      #       启动时对其做 envsubst（把 ${LLM_BINDING_API_KEY} 替换为容器环境变量的值），
      #       再渲染出 /etc/nginx/conf.d/webviz.conf。这样真实 LLM key 只需在 .env 里
      #       提供，代码里不写死。
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-webviz.conf:/etc/nginx/templates/webviz.conf.template:ro

  # ========== LightRAG 服务（7 个图谱 = 6 分图 + 1 总图） ==========
  # 机制：LightRAG v1.5.6 一个容器实例固定使用一个 WORKSPACE；存储层按工作区
  #   天然隔离 —— Neo4j 每个工作区一个节点标签、Qdrant 每个工作区独立集合、
  #   PostgreSQL 用 workspace 列隔离。因此"一套数据库 + 7 个实例（各带不同
  #   WORKSPACE 环境变量）"即可在同一个 LightRAG 项目中并存多个互不串扰的图谱。
  #
  # 端口与工作区规划：
  #   lightrag      9621  g00_master_all             总图谱（六维度资料全部传入）
  #   lightrag-g01  9622  g01_people_literature      人物与文献
  #   lightrag-g02  9623  g02_places_routes          地点与交通
  #   lightrag-g03  9624  g03_varieties              荔枝品种
  #   lightrag-g04  9625  g04_history_institutions   历史与制度
  #   lightrag-g05  9626  g05_lingnan_liwan          岭南文化与荔湾
  #   lightrag-g06  9627  g06_industry_tech          现代产业与科技
  #
  # 内存策略：6 个分图实例归入 compose profile "subgraphs"，默认不启动；
  #   上传某维度资料或课堂需要时再按需启动（可用 switch-graph.ps1 切换，
  #   始终只保留一个分图实例在跑）。总图实例 lightrag 默认随基础设施启动。
  #   全部启动：docker compose --profile subgraphs up -d

  # ------ 总图实例（默认启动） ------
  lightrag:
    image: ghcr.1ms.run/hkuds/lightrag:latest
    container_name: lightrag-server
    restart: unless-stopped
    depends_on: &lightrag-depends
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-9621}:9621"
    volumes: &lightrag-volumes
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      # PROMPT_DIR 挂载：entity_type/*.yml 官方原生支持自定义实体类型 + few-shot
      - ./data/prompts:/app/data/prompts
      - ./.env:/app/.env:ro
      # 注意：之前的 ./data/lightrag_overrides/prompt.py 覆盖已回滚（避免 422 等异常），
      #       只保留 PROMPT_DIR 实体抽取 prompt 覆盖，回答 prompt 用官方默认。
    environment: &lightrag-env
      # 默认值=总图谱工作区；各分图实例在自己的 environment 里覆盖 WORKSPACE
      WORKSPACE: "g00_master_all"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      HOST: "0.0.0.0"
      PORT: "9621"
      # LLM（SiliconFlow DeepSeek-V3，OpenAI 兼容协议）
      # 安全：key 从 .env 读取（.env 不入 git），不要在代码里硬编码真实 key。
      LLM_BINDING: "openai"
      LLM_BINDING_HOST: "https://api.siliconflow.cn/v1"
      LLM_BINDING_API_KEY: "${LLM_BINDING_API_KEY:?请在 .env 中设置 LLM_BINDING_API_KEY}"
      LLM_MODEL: "deepseek-ai/DeepSeek-V3"
      # Embedding（保持不变）
      EMBEDDING_BINDING: "openai"
      EMBEDDING_BINDING_HOST: "https://api.siliconflow.cn/v1"
      EMBEDDING_BINDING_API_KEY: "${EMBEDDING_BINDING_API_KEY:?请在 .env 中设置 EMBEDDING_BINDING_API_KEY}"
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_DIM: "1024"
      # Qdrant 连接（compose 内部网络，服务名=qdrant）
      QDRANT_URL: "http://qdrant:6333"
      # Neo4j 连接（密码从 .env 注入，避免硬编码；缺失则启动失败）
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}"
      # PostgreSQL 连接（compose 内部网络，服务名=postgres，密码从 .env 注入）
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE:?请在 .env 中设置 POSTGRES_DATABASE}"
      # 存储后端切换：KV / DocStatus → PostgreSQL（替换默认 JSON 文件存储）
      LIGHTRAG_KV_STORAGE: "PGKVStorage"
      LIGHTRAG_DOC_STATUS_STORAGE: "PGDocStatusStorage"
      # 妃子笑荔枝文化课程定制实体关系抽取（注入环境变量，不依赖 .env 加载时机）
      SUMMARY_LANGUAGE: "Chinese"
      ENTITY_EXTRACTION_USE_JSON: "true"
      ENTITY_TYPE_PROMPT_FILE: "lychee_culture.yml"
      MAX_EXTRACTION_RECORDS: "60"
      MAX_EXTRACTION_ENTITIES: "30"
      MAX_GLEANING: "2"
    extra_hosts: &lightrag-hosts
      - "host.docker.internal:host-gateway"

  # ------ 分图 1：人物与文献（按需启动，profile=subgraphs） ------
  lightrag-g01: &lightrag-sub
    image: ghcr.1ms.run/hkuds/lightrag:latest
    profiles: ["subgraphs"]
    container_name: lightrag-g01
    restart: unless-stopped
    depends_on: *lightrag-depends
    ports:
      - "127.0.0.1:9622:9621"
    volumes: *lightrag-volumes
    environment:
      <<: *lightrag-env
      WORKSPACE: "g01_people_literature"
      ENTITY_TYPE_PROMPT_FILE: "lychee_g01_people.yml"
    extra_hosts: *lightrag-hosts

  # ------ 分图 2：地点与交通 ------
  lightrag-g02:
    <<: *lightrag-sub
    container_name: lightrag-g02
    ports:
      - "127.0.0.1:9623:9621"
    environment:
      <<: *lightrag-env
      WORKSPACE: "g02_places_routes"
      ENTITY_TYPE_PROMPT_FILE: "lychee_g02_places.yml"

  # ------ 分图 3：荔枝品种 ------
  lightrag-g03:
    <<: *lightrag-sub
    container_name: lightrag-g03
    ports:
      - "127.0.0.1:9624:9621"
    environment:
      <<: *lightrag-env
      WORKSPACE: "g03_varieties"
      ENTITY_TYPE_PROMPT_FILE: "lychee_g03_varieties.yml"

  # ------ 分图 4：历史与制度 ------
  lightrag-g04:
    <<: *lightrag-sub
    container_name: lightrag-g04
    ports:
      - "127.0.0.1:9625:9621"
    environment:
      <<: *lightrag-env
      WORKSPACE: "g04_history_institutions"
      ENTITY_TYPE_PROMPT_FILE: "lychee_g04_history.yml"

  # ------ 分图 5：岭南文化与荔湾 ------
  lightrag-g05:
    <<: *lightrag-sub
    container_name: lightrag-g05
    ports:
      - "127.0.0.1:9626:9621"
    environment:
      <<: *lightrag-env
      WORKSPACE: "g05_lingnan_liwan"
      ENTITY_TYPE_PROMPT_FILE: "lychee_g05_lingnan.yml"

  # ------ 分图 6：现代产业与科技 ------
  lightrag-g06:
    <<: *lightrag-sub
    container_name: lightrag-g06
    ports:
      - "127.0.0.1:9627:9621"
    environment:
      <<: *lightrag-env
      WORKSPACE: "g06_industry_tech"
      ENTITY_TYPE_PROMPT_FILE: "lychee_g06_industry.yml"

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_display_data:
  neo4j_display_logs:
  qdrant_data:
  postgres_data:
  pgadmin_data:
