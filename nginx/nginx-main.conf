# ============================================================
# webviz 主配置（替代 nginx:alpine 默认 nginx.conf）
# 关键：以 root 运行 worker，避免 Windows 挂载目录权限（文件 0600 / uid 1000）
#       导致 nginx 无法读取 /kb 下的原文 markdown。
# ============================================================
user root;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 限流区定义：用于限制 /api/ 请求频率。
    # 必须在 http {} 块内定义（不能在 server{} 或 location{} 里），
    # 10 r/s 是单 IP 平均速率，burst=20 容忍短时尖刺（见站点配置里的 limit_req）。
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # 不加载镜像自带的 default.conf（会与我们的 server 冲突）
    include /etc/nginx/conf.d/webviz.conf;
}
