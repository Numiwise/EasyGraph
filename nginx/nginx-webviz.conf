    # 前端 SPA：未命中的路径回落到 index.html
    # no-store：每次都重新拉（解决"老浏览器缓存 vendor-vis 0 字节 stale 文件"问题�?
    #   no-cache 只是校验，可能命�?304 缓存；no-store 强制重拉最稳�?
    #
    # 关键：拦截老的 vendor-vis*.js（早期拆分产生的�?chunk）直�?404�?
    #   否则 try_files 会回落到 index.html�?00），浏览器拿�?HTML �?JS 解析 �?各种 undefined�?
    #   现在 dist 里已经没�?vendor-vis*.js 了，但浏览器可能仍引用�?URL�?
    location ~ ^/assets/vendor-vis-[^/]+\.js$ {
        return 404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
