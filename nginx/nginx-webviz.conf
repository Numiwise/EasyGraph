# ============================================================
# webviz 站点配置（覆盖 nginx:alpine 默认 default.conf）
# 目的：
#   1) SPA 前端（Vue Router hash 模式）静态托管
#   2) 暴露 /kb/ 目录，映射到容器内 /kb（宿主 ./data/inputs）
#      供前端「查看完整原文」直接读取已解析的 markdown
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # 原始资料（html/pdf/png/jpg 等）：浏览器原生打开，沿用 mime.types 的 content-type
    # （必须放在 /kb/ 之前，最长前缀优先匹配）
    location /kb/_origin/ {
        alias /kb/_origin/;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*";
    }

    # 已解析原文（markdown），以纯文本返回，浏览器/前端可直接读取
    location /kb/ {
        alias /kb/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*";
    }

    # ============================================================
    # LLM 反代（AI 回答「深加工」用）：把 /llm/... 转发到 SiliconFlow
    # ------------------------------------------------------------
    # 用途：前端拿到 LightRAG 原始回答后，再调一次 LLM 改写（更口语化、
    #       开门见山、保留 [n] 引用）。为避免把 LLM key 暴露给浏览器 JS，
    #       由 nginx 在这里注入 Authorization 头。
    # 路径映射：/llm/chat/completions → https://api.siliconflow.cn/v1/chat/completions
    # 注意：前端须用 OpenAI 兼容的 chat/completions 请求体。
    # 安全：下面的 ${LLM_BINDING_API_KEY} 由 nginx 启动时从容器环境变量注入
    #       （见 docker-compose webviz.environment），容器环境变量来自 .env。
    #       真实 key 绝不写死在本文件，避免提交泄露。
    # ============================================================
    location /llm/ {
        proxy_pass https://api.siliconflow.cn/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.siliconflow.cn;
        proxy_set_header Authorization "Bearer ${LLM_BINDING_API_KEY}";
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # ============================================================
    # 后端 api-bridge 反代（图谱数据查询，隔离前端与数据库直连）
    # ------------------------------------------------------------
    # 用途：前端浏览器不再直连 Neo4j bolt:// 和 Qdrant http://，
    #       所有图谱数据查询统一走 /api/* 由本服务代理到 api-bridge。
    # 安全：api-bridge 端口 9630 仅绑定 127.0.0.1，不暴露到外网；
    #       nginx 与 api-bridge 同在 docker 内部网络，无 CORS 问题。
    # ============================================================
    location /api/ {
        proxy_pass http://api-bridge:9630/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # 前端 SPA：未命中的路径回落到 index.html
    # no-cache：浏览器每次加载都回服务器校验（改动的 JS/HTML 立即生效，未改动走 304）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
