# ============================================================
# webviz 站点配置（覆�?nginx:alpine 默认 default.conf�?
# 目的�?
#   1) SPA 前端（Vue Router hash 模式）静态托�?
#   2) 暴露 /kb/ 目录，映射到容器�?/kb（宿�?./data/inputs�?
#      供前端「查看完整原文」直接读取已解析�?markdown
#   3) /api/ 反代�?api-bridge，注�?X-Bridge-Token 头做内部认证
#   4) /llm/ 反代�?SiliconFlow，注�?LLM Authorization
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # 原始资料（html/pdf/png/jpg 等）：浏览器原生打开，沿�?mime.types �?content-type
    # （必须放�?/kb/ 之前，最长前缀优先匹配�?
    location /kb/_origin/ {
        alias /kb/_origin/;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*";
    }

    # 已解析原文（markdown），以纯文本返回，浏览器/前端可直接读�?
    location /kb/ {
        alias /kb/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*";
    }

    # ============================================================
    # LLM 反代（AI 回答「深加工」用）：�?/llm/... 转发�?SiliconFlow
    # ------------------------------------------------------------
    # 用途：前端拿到 LightRAG 原始回答后，再调一�?LLM 改写（更口语化�?
    #       开门见山、保�?[n] 引用）。为避免�?LLM key 暴露给浏览器 JS�?
    #       �?nginx 在这里注�?Authorization 头�?
    # 路径映射�?llm/chat/completions �?https://api.siliconflow.cn/v1/chat/completions
    # 注意：前端须�?OpenAI 兼容�?chat/completions 请求体�?
    # 安全：下面的 ${LLM_BINDING_API_KEY} �?nginx 启动时从容器环境变量注入
    #       （见 docker-compose webviz.environment），容器环境变量来自 .env�?
    #       真实 key 绝不写死在本文件，避免提交泄露�?
    # ============================================================
    location /llm/ {
        # 使用 Docker 嵌入�?DNS (127.0.0.11) 在请求时解析 upstream�?
        # 避免 nginx:alpine 启动时同�?DNS 解析失败导致容器反复重启�?
        # （https://docs.docker.com/engine/network/#dns-services�?
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 10s;
        # 必须用变量形�?proxy_pass，nginx 才会在请求时重新解析（而不是启动时�?
        set $llm_upstream https://api.siliconflow.cn/v1/;
        proxy_pass $llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.siliconflow.cn;
        proxy_set_header Authorization "Bearer ${LLM_BINDING_API_KEY}";
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # ============================================================
    # 后端 api-bridge 反代（图谱数据查询，隔离前端与数据库直连�?
    # ------------------------------------------------------------
    # 用途：前端浏览器不再直�?Neo4j bolt:// �?Qdrant http://�?
    #       所有图谱数据查询统一�?/api/* 由本服务代理�?api-bridge�?
    # 安全（多层防御）�?
    #   1) api-bridge 端口 9630 仅绑�?127.0.0.1，外部网络到不了
    #   2) nginx �?api-bridge 同在 docker 内部网络，无 CORS 问题
    #   3) nginx 在反代时注入 X-Bridge-Token 头；api-bridge 用常量时�?
    #      比较校验，浏览器 JS 永远拿不到这个头（不可伪造）
    #   4) limit_req_zone 限流 10 r/s，拦截脚本爆�?
    # ============================================================
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        # 使用 Docker 嵌入�?DNS (127.0.0.11) 在请求时解析 upstream�?
        # �?/llm/ 同理：避�?nginx:alpine 启动时同步解�?Docker 服务名失�?
        # 导致容器反复重启（docker compose 启动顺序不保�?webviz 一定晚�?api-bridge）�?
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 10s;
        # 必须用变量形�?proxy_pass，nginx 才会在请求时重新解析（而不是启动时）�?
        # 变量�?proxy_pass 不会自动去掉 location 前缀，所以手动拼目标路径�?
        # /api/counts �?http://api-bridge:9630/api/counts（保留后�?/api 前缀）�?
        set $api_upstream http://api-bridge:9630/api;
        set $api_path "";
        if ($uri ~ ^/api/(.*)$) {
            set $api_path /$1;
        }
        # 关键：变量式 proxy_pass 不会自动透传 query string�?
        # 必须在末尾显式追�??$args，否则后�?FastAPI 拿不�?ws / limit 等参数（422）�?
        proxy_pass $api_upstream$api_path?$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 内部认证头（关键！）：值由 nginx 启动时从容器环境变量 BRIDGE_TOKEN 注入�?
        # 浏览器无法伪造（前端 fetch 不到这个 server header）�?
        proxy_set_header X-Bridge-Token "${BRIDGE_TOKEN}";
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # ============================================================
    # /__fix-auth.js —�?自动注入�?LightRAG WebUI 的修复脚�?
    # ------------------------------------------------------------
    # LightRAG 1.5.7 SPA �?auth 流程 bug：useEffect �?`await Se()` 会抛
    # TypeError（Se �?useState 字符串而非函数），导致 isAuthenticated 永远
    # false，被路由守卫跳到 /login。本脚本通过 fetch /auth-status 拿到 guest
    # token 写入 localStorage，并定时器兜底，实现免登录�?
    # ============================================================
    location = /__fix-auth.js {
        alias /etc/nginx/fix-auth/fix-auth.js;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # ============================================================
    # LightRAG �?workspace 反代（本地开发环境与云端路径保持一致）
    # /lightrag/<ws>/  �?http://<service>:9621/
    # 这样前端按钮统一�?/lightrag/<ws>/webui/，本地和云端行为相同�?
    # 上传 /documents �?multipart 大文件，关闭缓冲 + 长超时�?
    # ============================================================
    location /lightrag/g00_master_all/ {
        # 使用 Docker 嵌入�?DNS 在请求时解析 upstream，避�?nginx 启动�?
        # 同步解析 lightrag-server 失败导致容器反复重启�?
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 10s;
        set $lr_upstream http://lightrag-server:9621;
        set $lr_path "";
        # 关键：变量式 proxy_pass 不会自动去掉 location 前缀�?
        # 所以手动把 /lightrag/<ws>/xxx 拼成目标路径 /xxx�?
        if ($uri ~ ^/lightrag/g00_master_all/(.*)$) {
            set $lr_path /$1;
        }
        proxy_pass $lr_upstream$lr_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sub_filter 注入 apiPrefix（修�?1.5.7 SPA �?URL 错误�?
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g00_master_all/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
