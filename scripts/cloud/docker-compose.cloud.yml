# ============================================================
# 腾讯云 CVM 部署版 docker-compose
# ------------------------------------------------------------
# 与原 docker-compose.yml 区别：
#   1) 加 cloud-nginx 服务（公网 HTTP 8080 反代到 webviz + api-bridge）
#   2) 不上 HTTPS（无证书 / 无域名），走纯 HTTP 8080 对外
#   3) 所有非 webviz/api-bridge 端口绑 127.0.0.1（不直接暴露）
#   4) neo4j/qdrant/postgres 不暴露端口（容器内部访问）
#
# 安全说明：
#   - 走 HTTP 明文：中间人能看你的浏览内容（问答 Q/A），看不到 API key
#   - API key 仅存在容器内 .env / 不进入前端代码
#   - 适用场景：演示 / 教学 / 无登录鉴权的轻分享
#   - 公网端口选 5806（非 80/8080），避开常规扫描器
# ============================================================
# 在云服务器上运行：
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
# ============================================================

version: '3.8'

services:
  # ============================================================
  # 公网反向代理（替代原来 webviz 直绑 5006）
  # ============================================================
  cloud-nginx:
    image: nginx:alpine
    container_name: lightrag-cloud-nginx
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/entrypoint.sh"]
    ports:
      - "5806:80"
    volumes:
      # nginx 配置（与原 nginx/ 目录结构保持一致）
      - ./nginx/nginx-main-cloud.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-cloud-webviz.conf:/etc/nginx/templates/webviz.conf.template:ro
      - ./nginx/nginx-entrypoint.sh:/docker-entrypoint.d/entrypoint.sh:ro
      # 前端 dist
      - ./dist:/usr/share/nginx/html:ro
      # 原文资料
      - ./data/inputs:/kb:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-$HOSTNAME}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY:-}
      - BRIDGE_TOKEN=${BRIDGE_TOKEN}
    depends_on:
      - webviz
      - api-bridge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # webviz：端口只绑 127.0.0.1（公网不直接访问，只走 cloud-nginx 反代）
  # ============================================================
  webviz:
    ports:
      - "127.0.0.1:5006:80"

  # ============================================================
  # api-bridge：只绑 127.0.0.1
  # ============================================================
  api-bridge:
    ports:
      - "127.0.0.1:9630:9630"

  # ============================================================
  # Neo4j：端口 7474/7475/7687 全部删除（不能开放）
  # 完整版 / display 都只能容器内访问
  # ============================================================
  neo4j:
    ports: []  # 覆盖原 compose 里的端口映射
  neo4j-display:
    ports: []

  # ============================================================
  # Qdrant：删除 6333/6334 端口映射
  # ============================================================
  qdrant:
    ports: []

  # ============================================================
  # Postgres：删除 5432 端口映射
  # ============================================================
  postgres:
    ports: []

  # ============================================================
  # pgAdmin：删除 5050（管理工具不放公网）
  # ============================================================
  pgadmin:
    ports: []
