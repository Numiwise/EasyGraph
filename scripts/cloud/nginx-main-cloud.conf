# ============================================================
# cloud-nginx 主配置（云端公网反代）
# 关键：
#   1) 定义 public_limit 限流 zone（云端 webviz.conf 里引用）
#   2) root 启动 worker（同本机）
# ============================================================
user root;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 静态文件根目录：docker-compose.cloud.yml 把 ./dist 挂到这里（ro）。
    # 必须显式声明，否则 nginx 默认使用 /etc/nginx/html（容器内是空目录），
    # 导致 try_files /index.html 找不到 → 内部重定向循环（500）。
    root /usr/share/nginx/html;

    # 公网限流 zone：
    #   20 r/s 单 IP 平均，burst=20 容忍短时尖刺
    #   10m 内存可记录 ~16 万 IP × 每秒 1 个状态
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=20r/s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # 把 webviz.conf.template 渲染成 conf.d/webviz.conf（envsubst 在容器启动时执行）
    include /etc/nginx/conf.d/*.conf;
}