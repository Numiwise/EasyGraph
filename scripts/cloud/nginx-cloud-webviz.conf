# ============================================================
# 腾讯云公网 nginx 配置（HTTP 反代 / 不上 HTTPS）
# ------------------------------------------------------------
# 监听 80（由 docker compose 把宿主 5806 映射进来）
# 直接反代到 webviz (127.0.0.1:5006) + api-bridge
#
# 无证书：浏览器访问 http://1.14.192.68:5806 会有"非安全"小标，
#        但不会拦截（仅登录类页面才有"不安全"红屏）。
# 适合无登录鉴权的演示/教学场景。
#
# 部署：放在云服务器的 ./nginx/webviz.conf.template
# nginx 启动时通过 envsubst 注入 SERVER_NAME / BRIDGE_TOKEN
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME} _;

    # 安全 headers（HTTP 下尽量加，对常见 XSS/iframe 嵌入攻击有防护）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 限流（公网防爬虫）
    limit_req zone=public_limit burst=20 nodelay;

    # 上传文件大小限制（单文件最大 50MB，避免被灌入超大文件消耗 LLM 配额）
    client_max_body_size 50m;

    # ============================================================
    # /__fix-auth.js —— 自动注入到 cloud-nginx 容器的 fix-auth.js
    # 不再走 LightRAG 反代；这里 nginx 直接从本地静态目录 serve。
    # LightRAG SPA 通过 sub_filter 引入它，修复 1.5.7 SPA 的 auth bug。
    # ============================================================
    location = /__fix-auth.js {
        alias /etc/nginx/fix-auth/fix-auth.js;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # ============================================================
    # /__local-config.js —— 已经废弃。
    # 之前方案是覆盖 lightrag SPA 的 __LIGHTRAG_CONFIG__，但 inline JS 会被
    # nginx envsubst 当成模板变量处理（吃掉 $1 等），导致 JS 语法错。
    # 现在改用 sub_filter 直接替换 lightrag-server 注入的 inline <script>
    # 里的 "apiPrefix": "" → "/lightrag/<ws>/"，更可靠。
    # ============================================================

    # 原始资料
    location /kb/_origin/ {
        alias /kb/_origin/;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }
    location /kb/ {
        alias /kb/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    # LLM 反代（如果前端需要再加工 LLM 回答，可选）
    location /llm/ {
        # 使用 Docker 嵌入式 DNS (127.0.0.11) 在请求时解析 upstream，
        # 避免 nginx:alpine 启动时同步 DNS 解析失败导致容器无法启动。
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 10s;
        # 必须用变量形式 proxy_pass，nginx 才会在请求时重新解析（而不是启动时）
        set $llm_upstream https://api.siliconflow.cn/v1/;
        proxy_pass $llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.siliconflow.cn;
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # api-bridge 反代（前端查图谱）
    location /api/ {
        limit_req zone=public_limit burst=20 nodelay;
        proxy_pass http://api-bridge:9630/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 不注 Authorization 头（避免 lightrag-server 把它当 Bearer token 校验导致 401）===
        # lightrag-server 在 auth_mode=disabled 时本应直接放行，但会先尝试解析 Authorization 头。
        # 用 "Bearer sk-xxx" 这种非 JWT 格式会被判为无效 token → 401。
        # 解决：让 lightrag-server 看到的是普通浏览器请求（无 Authorization 头），走 guest 流程。
        # === 注入 fix-auth.js 到 LightRAG HTML（关键！）===
        # LightRAG 1.5.7 SPA 有 auth 流程 bug：因 useEffect 里 `await Se()`（Se 实际是 useState
        # 字符串而非函数），永远进 catch，isAuthenticated 仍 false，被路由守卫跳到 /login。
        # fix-auth.js 通过 fetch 拦截 + localStorage 写入 + 定时器兜底，让 SPA 进入主界面。
        # 这里 sub_filter 注入 <script src>，绝对路径、不带 nginx 变量、无字符串转义问题。
        sub_filter '</body>' '<script src="/__fix-auth.js"></script><script src="/__local-config.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Token "${BRIDGE_TOKEN}";
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # LightRAG 各 workspace 反代（前端问答 + 上传 UI 同源路径）
    # /lightrag/<ws>/  → http://<service>:9621/
    # 注意：上传 /documents 是 multipart 大文件，关闭缓冲 + 长超时
    location /lightrag/g00_master_all/ {
        proxy_pass http://lightrag-server:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        # 1.5.7 SPA 内部用 __LIGHTRAG_CONFIG__.apiPrefix 拼 fetch URL。
        # lightrag-server 自己注入的 inline <script> 把 apiPrefix 设为 ""，导致 SPA 拼出
        # 错误 URL（如 http://lightrag/g00_master_all//auth-status）。
        # 我们用 sub_filter 把 "apiPrefix": "" 替换为 "apiPrefix": "/lightrag/g00_master_all/"。
        # sub_filter 是字符级替换，不解析 nginx 变量，因此不会污染 JS 内容。
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g00_master_all/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
    # === /login 路径拦截（关键！）
    # LightRAG 1.5.7 的 SPA 在 auth 失败时会跳到 /login 路由（hash router）。
    # SPA 仍然会处理 /webui/index.html，所以直接把 /login 的请求 rewrite 到 /webui/index.html。
    # 由于浏览器地址栏仍是 /webui/#/login，SPA 路由仍然看到 /login 的 hash，
    # 但 manifest / JS 资源加载都通过 nginx 反代到 lightrag-server，逻辑保持一致。
    location ~ ^/lightrag/g00_master_all/login$ {
        rewrite ^ /lightrag/g00_master_all/webui/ last;
    }
    location ~ ^/lightrag/g01_people_literature/login$ {
        rewrite ^ /lightrag/g01_people_literature/webui/ last;
    }
    location ~ ^/lightrag/g02_places_routes/login$ {
        rewrite ^ /lightrag/g02_places_routes/webui/ last;
    }
    location ~ ^/lightrag/g03_varieties/login$ {
        rewrite ^ /lightrag/g03_varieties/webui/ last;
    }
    location ~ ^/lightrag/g04_history_institutions/login$ {
        rewrite ^ /lightrag/g04_history_institutions/webui/ last;
    }
    location ~ ^/lightrag/g05_lingnan_liwan/login$ {
        rewrite ^ /lightrag/g05_lingnan_liwan/webui/ last;
    }
    location ~ ^/lightrag/g06_industry_tech/login$ {
        rewrite ^ /lightrag/g06_industry_tech/webui/ last;
    }
    location /lightrag/g01_people_literature/ {
        proxy_pass http://lightrag-g01:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g01_people_literature/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
    location /lightrag/g02_places_routes/ {
        proxy_pass http://lightrag-g02:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g02_places_routes/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
    location /lightrag/g03_varieties/ {
        proxy_pass http://lightrag-g03:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g03_varieties/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
    location /lightrag/g04_history_institutions/ {
        proxy_pass http://lightrag-g04:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g04_history_institutions/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
    location /lightrag/g05_lingnan_liwan/ {
        proxy_pass http://lightrag-g05:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g05_lingnan_liwan/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }
    location /lightrag/g06_industry_tech/ {
        proxy_pass http://lightrag-g06:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 关键：sub_filter 注入 apiPrefix（修复 1.5.7 SPA auth bug）===
        sub_filter '"apiPrefix": ""' '"apiPrefix": "/lightrag/g06_industry_tech/"';
        sub_filter '</body>' '<script src="/__fix-auth.js"></script></body>';
        sub_filter_once on;
        sub_filter_types *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-Requested-With";
        if ($request_method = OPTIONS) { return 204; }
    }

    # SPA 前端
    # 注意：必须显式 root 指到 dist 挂载点（容器内 /usr/share/nginx/html），
    # 否则 nginx 用默认 /etc/nginx/html，try_files 找不到 index.html，会陷入重定向循环（500）。
    root /usr/share/nginx/html;
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
