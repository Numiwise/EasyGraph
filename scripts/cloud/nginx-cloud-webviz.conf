# ============================================================
# 腾讯云公网 nginx 配置（HTTPS + 反代）
# ------------------------------------------------------------
# 监听 80 + 443
# 80: HTTP → 强制跳 HTTPS
# 443: HTTPS → 反代到 webviz (127.0.0.1:5006)
#
# 部署：放在云服务器的 ./nginx/webviz.conf.template
# nginx 启动时通过 envsubst 注入 SERVER_NAME / LLM_BINDING_API_KEY / BRIDGE_TOKEN
# ============================================================

# HTTP: 强制 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME} _;

    location /.well-known/acme-challenge/ {
        # Let's Encrypt 验证用（certbot 写入这里）
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 主站点
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_NAME};

    # SSL 证书（Let's Encrypt 签发路径：/etc/letsencrypt/live/${SERVER_NAME}/）
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 限流（公网防爬虫）
    limit_req zone=public_limit burst=20 nodelay;

    # 原始资料
    location /kb/_origin/ {
        alias /kb/_origin/;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }
    location /kb/ {
        alias /kb/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    # LLM 反代（如果你的前端需要再加工 LLM 回答）
    location /llm/ {
        proxy_pass https://api.siliconflow.cn/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.siliconflow.cn;
        proxy_set_header Authorization "Bearer ${LLM_BINDING_API_KEY}";
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # api-bridge 反代（前端查图谱）
    location /api/ {
        limit_req zone=public_limit burst=20 nodelay;
        proxy_pass http://api-bridge:9630/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Token "${BRIDGE_TOKEN}";
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # SPA 前端
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
