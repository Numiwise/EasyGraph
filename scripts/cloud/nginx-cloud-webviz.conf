# ============================================================
# 腾讯云公网 nginx 配置（HTTP 反代 / 不上 HTTPS）
# ------------------------------------------------------------
# 监听 80（由 docker compose 把宿主 5806 映射进来）
# 直接反代到 webviz (127.0.0.1:5006) + api-bridge
#
# 无证书：浏览器访问 http://1.14.192.68:5806 会有"非安全"小标，
#        但不会拦截（仅登录类页面才有"不安全"红屏）。
# 适合无登录鉴权的演示/教学场景。
#
# 部署：放在云服务器的 ./nginx/webviz.conf.template
# nginx 启动时通过 envsubst 注入 SERVER_NAME / LLM_BINDING_API_KEY / BRIDGE_TOKEN
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME} _;

    # 安全 headers（HTTP 下尽量加，对常见 XSS/iframe 嵌入攻击有防护）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 限流（公网防爬虫）
    limit_req zone=public_limit burst=20 nodelay;

    # 上传文件大小限制（单文件最大 50MB，避免被灌入超大文件消耗 LLM 配额）
    client_max_body_size 50m;

    # 原始资料
    location /kb/_origin/ {
        alias /kb/_origin/;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }
    location /kb/ {
        alias /kb/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    # LLM 反代（如果前端需要再加工 LLM 回答，可选）
    location /llm/ {
        # 使用 Docker 嵌入式 DNS (127.0.0.11) 在请求时解析 upstream，
        # 避免 nginx:alpine 启动时同步 DNS 解析失败导致容器无法启动。
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 10s;
        # 必须用变量形式 proxy_pass，nginx 才会在请求时重新解析（而不是启动时）
        set $llm_upstream https://api.siliconflow.cn/v1/;
        proxy_pass $llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.siliconflow.cn;
        proxy_set_header Authorization "Bearer ${LLM_BINDING_API_KEY}";
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # api-bridge 反代（前端查图谱）
    location /api/ {
        limit_req zone=public_limit burst=20 nodelay;
        proxy_pass http://api-bridge:9630/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 自动注入 API Key（关键！）===
        # 让浏览器访问 LightRAG WebUI 时无认证提示（用户不需要输入密码）。
        # nginx → lightrag-server 时自动带 X-API-Key + Authorization 头。
        # key 只在 nginx 容器环境变量里，不进前端 JS，不进浏览器请求。
        proxy_set_header X-API-Key "${LLM_BINDING_API_KEY}";
        proxy_set_header Authorization "Bearer ${LLM_BINDING_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Token "${BRIDGE_TOKEN}";
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        if ($request_method = OPTIONS) { return 204; }
    }

    # LightRAG 各 workspace 反代（前端问答 + 上传 UI 同源路径）
    # /lightrag/<ws>/  → http://<service>:9621/
    # 注意：上传 /documents 是 multipart 大文件，关闭缓冲 + 长超时
    location /lightrag/g00_master_all/ {
        proxy_pass http://lightrag-server:9621/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # === 自动注入 API Key（关键！）===
